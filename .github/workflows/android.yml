# Builds the Bandaid Finder and Bandaid Editor APKs.
#
# - Every push to main (except dataset and docs changes) produces signed APKs
#   as workflow artifacts, for testing. No release.
# - Releasing: Actions tab > "Android APKs" > Run workflow, enter a version
#   like 0.2.3. The workflow builds, creates tag v0.2.3 and a GitHub Release
#   with both APKs. Pushing a tag v0.2.3 yourself does the same.
# - The version is stamped into the APKs (scripts/patch-android.mjs), so each
#   release installs as an update over the previous one.
# - Without the signing secrets (see README) debug APKs are built instead,
#   which must be uninstalled before updating.
name: Android APKs

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'public/data/**' # dataset commits from the Editor app must not trigger builds
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.3 (empty = test build, no release)'
        required: false
        type: string

permissions:
  contents: write # needed to create the tag and release

jobs:
  # Decides what this run is: a release (version given or tag pushed) or a test build.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to refuse a version that was already released
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
              echo "::error::Version must look like 0.2.3 (minor and patch below 100), got '$INPUT_VERSION'"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::v$VERSION already exists. Pick a higher version."; exit 1
            fi
            RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          else
            VERSION=$(node -p "require('./package.json').version"); RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" = true ]; then KIND="Release"; else KIND="Test build"; fi
          echo "### $KIND $VERSION" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [finder, editor]
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The GitHub Ubuntu runners ship a current Android SDK in $ANDROID_HOME.
      # android-actions/setup-android@v3 replaced it with older command-line
      # tools whose license step fails, so we use the preinstalled SDK and only
      # make sure its licenses are accepted (Gradle may download a missing platform).
      - name: Check Android SDK and accept licenses
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" || { echo "::error::No preinstalled Android SDK on this runner"; exit 1; }
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          { yes || true; } | "$SDKMANAGER" --licenses > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:${{ matrix.app }}

      - name: Generate and sync Android project
        working-directory: apps/${{ matrix.app }}
        run: |
          [ -d android ] || npx cap add android
          node ../../scripts/patch-android.mjs ${{ matrix.app }}
          npx cap sync android

      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        working-directory: apps/${{ matrix.app }}/android
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/bandaid-${{ matrix.app }}-debug.apk"

      - name: Build and sign release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/${{ matrix.app }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon assembleRelease
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out "$GITHUB_WORKSPACE/out/bandaid-${{ matrix.app }}.apk" "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: bandaid-${{ matrix.app }}
          path: out/*.apk

  # One release with both APKs, created only for release runs.
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: out/*.apk
