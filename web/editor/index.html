<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dc002d" />
    <title>Bandaid Editor</title>
  </head>
  <body>
    <header class="bar">
      <h1>Bandaid Editor</h1>
      <span id="status" role="status">Loading...</span>
      <button id="open-settings" class="bar-button" type="button" aria-label="Settings">⚙</button>
    </header>

    <main id="map" aria-label="Campus map"></main>
    <nav id="floors" class="floors" aria-label="Floor" hidden></nav>

    <section class="tools">
      <button id="add-toggle" type="button" aria-pressed="false">+ Add dispenser</button>
    </section>

    <!-- Detail panel for a new or existing dispenser -->
    <form id="detail" class="sheet detail" hidden>
      <div class="sheet-head">
        <h2 id="detail-title">Dispenser</h2>
        <button id="detail-close" type="button" aria-label="Close">✕</button>
      </div>

      <fieldset class="fill" id="fill-group">
        <legend>How full? <span id="checked-at" class="hint"></span></legend>
        <div id="fill-buttons" class="segmented"></div>
      </fieldset>

      <div class="grid2">
        <label>Building <input name="building" inputmode="numeric" /></label>
        <label>Room <input name="room" /></label>
      </div>
      <label>Note <input name="note" placeholder="e.g. inside first aid cabinet" /></label>
      <p class="hint">Floor <strong id="detail-floor"></strong>. Building and room are filled from the floor plan when you tap inside a room.</p>

      <div class="row">
        <button type="submit" class="primary">Save</button>
        <button id="move" type="button">Move</button>
        <button id="delete" type="button" class="danger">Delete</button>
      </div>
    </form>

    <!-- Settings: GitHub token -->
    <form id="settings" class="sheet" hidden>
      <div class="sheet-head">
        <h2>GitHub access</h2>
        <button id="settings-close" type="button" aria-label="Close">✕</button>
      </div>
      <p class="hint">
        Changes are committed to <strong id="repo-name"></strong>. Create a fine-grained personal access token for
        that repository only, with permission <em>Contents: Read and write</em>.
      </p>
      <label>Token <input name="token" type="password" autocomplete="off" spellcheck="false" /></label>
      <div class="row">
        <button type="submit" class="primary">Save and test</button>
        <button id="forget-token" type="button">Forget token</button>
      </div>
      <p id="settings-result" class="hint" role="status"></p>
    </form>

    <script type="module" src="./main.js"></script>
  </body>
</html>
